name: Deploy to WHC (Canada)

# CI/CD: push to main auto-deploys; PRs are validated (test+build) but not deployed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-whc
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (gate — a failing test blocks the deploy)
        run: pnpm test

      - name: Build (standalone)
        env:
          CI: "true"
          STANDALONE_BUILD: "1"
          # Public values are baked into the client bundle — must be real:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          # Server-only values: the build never connects, it only needs them DEFINED
          # (valid formats to satisfy SDK constructors). Real values live in
          # /root/jechemine.env on the server, loaded at runtime via --env-file.
          MONGODB_URI: "mongodb://127.0.0.1:27017/build"
          NEXTAUTH_SECRET: "build_time_placeholder_secret_0123456789abcdef"
          NEXTAUTH_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: "sk_test_build0000000000000000000000"
          STRIPE_WEBHOOK_SECRET: "whsec_build0000000000000000000000"
          STRIPE_CONNECT_CLIENT_ID: "ca_build0000000000000000000000"
          TWILIO_ACCOUNT_SID: "AC00000000000000000000000000000000"
          TWILIO_AUTH_TOKEN: "00000000000000000000000000000000"
          TWILIO_FROM_NUMBER: "+15550000000"
          SMTP_HOST: "smtp.example.com"
          SMTP_PORT: "587"
          SMTP_USER: "build@example.com"
          SMTP_PASS: "placeholder"
          MAIL_FROM: "build@example.com"
          MAIL_FROM_NAME: "Build"
          SUPPORT_EMAIL: "support@example.com"
          INTERAC_DEPOSIT_EMAIL: "deposit@example.com"
          ADMIN_ALERT_EMAIL: "admin@example.com"
          CLOUDMERSIVE_API_KEY: "placeholder"
          CRON_SECRET: "build_placeholder"
          PLATFORM_FEE_PERCENTAGE: "10"
          DEFAULT_CURRENCY: "cad"
          SMS_DRY_RUN: "true"
        run: pnpm build

      - name: Assemble standalone bundle
        run: |
          set -e
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          # Merge public/ CONTENTS into deploy/public (the standalone may already
          # have a public/ dir — copying the dir itself would nest it one level).
          mkdir -p deploy/public
          cp -r public/. deploy/public/
          # Ensure sharp (native image optimizer for next/image) is present + resolvable.
          ( cd deploy && npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.5 )
          echo "public entries: $(ls deploy/public | wc -l); sharp: $([ -d deploy/node_modules/sharp ] && echo yes || echo no)"
          tar -czf deploy.tar.gz -C deploy .
          ls -lh deploy.tar.gz

      - name: Deploy to WHC server
        # Only deploy on push to main / manual run — PRs validate (test+build) but never deploy.
        if: github.event_name != 'pull_request'
        env:
          WHC_SSH_KEY: ${{ secrets.WHC_SSH_KEY }}
          WHC_HOST: ${{ secrets.WHC_HOST }}
          WHC_PORT: ${{ secrets.WHC_PORT }}
          WHC_USER: ${{ secrets.WHC_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$WHC_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$WHC_PORT" "$WHC_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/deploy_key -P "$WHC_PORT" -o StrictHostKeyChecking=accept-new \
            deploy.tar.gz "$WHC_USER@$WHC_HOST:/root/deploy.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "$WHC_PORT" -o StrictHostKeyChecking=accept-new \
            "$WHC_USER@$WHC_HOST" 'bash -s' < scripts/whc-activate.sh
